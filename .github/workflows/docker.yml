name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for application
        run: sleep 10

      - name: Test API
        run: curl http://localhost:5000/health

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

                - name: Push backend image
        run: |
          docker tag retail-app-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/retail-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/retail-backend:latest

      - name: Push frontend image
        run: |
          docker tag retail-app-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/retail-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/retail-frontend:latest